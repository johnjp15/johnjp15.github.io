<!DOCTYPE html>
<html lang="en" class="checking">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>CS2 · Password required</title>
<style>
:root{
  /* Lock screen: one centered card on the replay's night palette. Nothing about the page itself leaks here. */
  --night:#0c1218;
  --slab:#131b24;
  --rule:#253242;
  --sand:#ece2cc;
  --sand-dim:#9f988a;
  --clay:#e47b3e;
  --bomb:#ff6b66;
  --f-display:'Saira Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--sand);font:16px/1.45 var(--f-body);display:grid;place-items:center;padding:16px}
.checking .card{visibility:hidden}
.card{width:100%;max-width:380px;background:var(--slab);border:1px solid var(--rule);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 11px/1 ui-monospace,'SFMono-Regular',Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sand-dim)}
h1{margin:0;font:700 28px/1.05 var(--f-display);letter-spacing:.02em;text-wrap:balance}
p{margin:0;color:#d6ccb8}
form{display:flex;flex-direction:column;gap:12px}
label[for="pw"]{font-size:13px;color:var(--sand-dim)}
input[type="password"]{width:100%;font-size:17px;padding:12px 13px;border-radius:9px;border:1px solid #33424f;background:#0b1117;color:var(--sand)}
input[type="password"]:focus{outline:2px solid var(--clay);outline-offset:1px;border-color:transparent}
.rem{display:flex;align-items:center;gap:9px;font-size:14px;color:#d6ccb8;cursor:pointer}
.rem input{width:19px;height:19px;margin:0;accent-color:var(--clay)}
button{font:700 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:13px 16px;border-radius:9px;border:0;background:var(--clay);color:#1a0f08;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
button[disabled]{opacity:.65;cursor:progress}
#msg{min-height:1.4em;font-size:14px}
#msg.err{color:var(--bomb)}
</style>
</head>
<body>

  <div class="eyebrow">johnjp15.github.io / cs2</div>
  <h1>Password required</h1>
  <p>This CS2 page is just for friends. Enter the password to open it.</p>
  <form id="f" autocomplete="on">

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <noscript><p>This page needs JavaScript to unlock.</p></noscript>
</main>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var STORE = 'cs2-lock-v1:' + P.salt.slice(0, 12);
  var subtle = window.crypto && window.crypto.subtle;
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function ready() { document.documentElement.classList.remove('checking'); }
  function say(text, err) { msg.textContent = text; msg.className = err ? 'err' : ''; }
  function remembered() { try { return sessionStorage.getItem(STORE) || localStorage.getItem(STORE); } catch (e) { return null; } }
  function remember(raw, keep) {
    var v = b64(raw);
    try { sessionStorage.setItem(STORE, v); } catch (e) {}
    try { if (keep) localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) {}
  }
  function forget() { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {} }
  function derive(pw) {
    return subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function decrypt(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (key) { return subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  // Replace this page with the decrypted one. Only after load: while the lock page is still
  // loading, document.open() is ignored and the page would be appended instead of replacing it.
  function show(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
  }

  if (!subtle) { ready(); say('This browser can’t unlock the page. Open it over https in an up-to-date browser.', true); $('go').disabled = true; return; }
  var saved = remembered();
  if (saved) {
    decrypt(bytes(saved)).then(show, function () { forget(); ready(); });
  } else {
    ready();
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; say('Unlocking…');
    var raw;
    derive(pw).then(function (r) { raw = r; return decrypt(r); }).then(function (html) {
      remember(raw, $('rem').checked); show(html);
    }, function () {
      $('go').disabled = false; say('That password didn’t work. Check it and try again.', true); $('pw').select();
    });
  });
})();
</script>
